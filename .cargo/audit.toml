# Exceptions `cargo audit` (roadmap audit 2026-10-20, 0.5). Le job CI `audit`
# est bloquant : tout nouvel avis RustSec casse la CI, sauf ceux listés ici,
# chacun avec sa raison et la sortie prévue.
[advisories]
ignore = [
    # bincode 1.3.3 non maintenu (pas de vulnérabilité connue). Utilisé
    # seulement pour le protocole réseau (`net::protocol`, `xr::ball::net`),
    # trames bornées à 64 Kio côté serveur. Migration vers postcard ou
    # bincode 2 = bump de PROTOCOL_VERSION et redéploiement coordonné
    # (roadmap audit 2026-10-20, 4.5).
    "RUSTSEC-2025-0141",
    # ttf-parser 0.25 non maintenu, transitif : sctk-adwaita → ab_glyph
    # (décorations Wayland de winit, Linux seulement). Disparaîtra avec une
    # montée de winit.
    "RUSTSEC-2026-0192",
]
