name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + tests + lint sur desktop (Linux).
  check:
    name: Build & test (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache des objets LFS (roadmap post-audit 2026-09-03, 1.4) : sans lui,
      # chaque run retéléchargeait les 159 Mo d'assets/models/, cinq jobs par
      # push — de quoi épuiser un quota de bande passante LFS mensuel en
      # quelques jours (0.3, ci-dessus). `git lfs pull` ne récupère que les
      # objets absents de `.git/lfs` : la clé change seulement quand un modèle
      # change, sinon le cache est intégralement réutilisé.
      - name: Liste des objets LFS (clé de cache)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Récupérer les modèles (assets/models/)
        run: git lfs pull

      - name: Installer la toolchain Rust (version épinglée, cf. rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Dépendances système pour winit/wgpu/egui sur Linux. libdbus-1-dev
      # (roadmap post-audit 2026-09-03, 2.1 suite) : `cargo update` a fait
      # passer `cpal` (audio, via `kira`) à 0.18, qui tire `audio_thread_
      # priority` sur Linux — lie `libdbus-1-dev` (priorité temps réel du
      # thread audio via RealtimeKit/D-Bus) au lien, pas seulement à
      # l'exécution : sans le paquet -dev, même `cargo build`/`cargo test`
      # échoue (`pkg-config` ne trouve pas dbus-1.pc). Invisible en local sur
      # macOS, qui n'emprunte pas ce chemin de compilation.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libudev-dev libdbus-1-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      # `--all-features` (pas seulement `--all-targets`) : compile aussi le code
      # gaté par la feature `net_tests` sans l'exécuter (le job `net-tests`
      # s'en charge) — roadmap post-audit 2026-09-03, 0.2/0.2 bis : sans ça,
      # ce code avait pourri en silence pendant six semaines (deux ruptures
      # de compilation indépendantes).
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Budget unwrap/expect/panic (Sprint 113b)
        run: python3 scripts/check_unwrap_budget.py

      - name: Orphelins du bundle embarqué (audit 2026-07-20, A2)
        run: python3 scripts/check_bundle_orphans.py

  # Tests réseau à sockets réels (feature `net_tests`, cf. Cargo.toml et
  # docs/architecture.md) : ils ouvrent des sockets TCP sur localhost, ce que
  # les runners ubuntu-latest autorisent. Job séparé du job `check` pour ne pas
  # rallonger le chemin critique et isoler d'éventuels flakes réseau.
  net-tests:
    name: Tests réseau (net_tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache des objets LFS (roadmap post-audit 2026-09-03, 1.4) : sans lui,
      # chaque run retéléchargeait les 159 Mo d'assets/models/, cinq jobs par
      # push — de quoi épuiser un quota de bande passante LFS mensuel en
      # quelques jours (0.3, ci-dessus). `git lfs pull` ne récupère que les
      # objets absents de `.git/lfs` : la clé change seulement quand un modèle
      # change, sinon le cache est intégralement réutilisé.
      - name: Liste des objets LFS (clé de cache)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Récupérer les modèles (assets/models/)
        run: git lfs pull

      - name: Installer la toolchain Rust (version épinglée, cf. rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Dépendances système pour winit/wgpu/egui sur Linux. libdbus-1-dev
      # (roadmap post-audit 2026-09-03, 2.1 suite) : `cargo update` a fait
      # passer `cpal` (audio, via `kira`) à 0.18, qui tire `audio_thread_
      # priority` sur Linux — lie `libdbus-1-dev` (priorité temps réel du
      # thread audio via RealtimeKit/D-Bus) au lien, pas seulement à
      # l'exécution : sans le paquet -dev, même `cargo build`/`cargo test`
      # échoue (`pkg-config` ne trouve pas dbus-1.pc). Invisible en local sur
      # macOS, qui n'emprunte pas ce chemin de compilation.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libudev-dev libdbus-1-dev pkg-config

      # Couvre aussi les tests TCP du pont Pilot (tests/pilot_bridge.rs),
      # gatés `net_tests` pour la même raison que le réseau : certains
      # environnements interdisent même le bind loopback.
      - name: Tests avec sockets réels
        run: cargo test --features net_tests

  # Goldens de rendu sur macOS : les runners Apple Silicon ont un GPU Metal,
  # contrairement à ubuntu-latest où ces tests sont sautés faute de GPU.
  # Durci (Phase R, `sprint2audijeu0718.md`) : 15 runs verts consécutifs sur
  # `main` observés avant de retirer `continue-on-error` — le job était
  # informatif depuis son introduction (commit 48ae056) le temps de vérifier
  # que le GPU des runners ne divergeait pas assez du GPU local (qui a produit
  # les goldens) pour dépasser la tolérance de `assert_matches_golden`.
  golden:
    name: Goldens de rendu (macOS/Metal)
    runs-on: macos-latest
    steps:
      # Pas de `lfs: true` ici (roadmap post-audit 2026-09-03, 0.3) :
      # tests/golden_render.rs et golden_skinning.rs ne référencent aucun
      # fichier d'assets/models/, inutile de payer le téléchargement LFS.
      - uses: actions/checkout@v4

      - name: Installer la toolchain Rust (version épinglée, cf. rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests goldens (rendu + skinning)
        run: cargo test --test golden_render --test golden_skinning

  # Vérifie que la lib compile pour les cibles mobiles (build seul, pas de tests).
  cross-build:
    name: Build cross (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-latest
            target: aarch64-apple-ios
          # Sprint 114 : la scène s'affiche dans Chrome (vérifié manuellement, cf.
          # ROADMAP_SPRINTS.md), mais ce job reste build-only — pas de vérification
          # visuelle automatisée en CI pour l'instant, juste la non-régression de
          # compilation sur cette cible.
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
    steps:
      # Pas de `lfs: true` ici (roadmap post-audit 2026-09-03, 0.3) : build
      # `--lib` seul, `build.rs` n'embarque qu'assets/bundle (Git normal),
      # jamais assets/models/.
      - uses: actions/checkout@v4

      - name: Installer la toolchain Rust (version épinglée, cf. rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # aarch64-linux-android n'a pas de linker C par défaut sur le runner :
      # même NDK/API que `packaging/android_env.sh` (dev local), juste le
      # préfixe `linux-x86_64` du toolchain prébuilt au lieu de `darwin-x86_64`.
      - name: Installer le NDK Android
        if: matrix.target == 'aarch64-linux-android'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;28.2.13676358" --sdk_root="$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Configurer le linker Android (API 26 — cf. packaging/android_env.sh)
        if: matrix.target == 'aarch64-linux-android'
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_aarch64_linux_android=$TC/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TC/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"

      - name: Build lib pour ${{ matrix.target }}
        run: cargo build --lib --target ${{ matrix.target }}

  # Avis de sécurité RustSec sur les dépendances (roadmap post-audit 2026-09-03,
  # 1.5). `continue-on-error` le temps de vérifier que la base d'avis ne produit
  # pas de faux positifs bruyants sur ce dépôt — même précaution que le job
  # `golden` à son introduction (15 runs verts avant de le retirer). Pas de
  # `lfs: true` : un scan de Cargo.lock n'a besoin d'aucun asset.
  audit:
    name: Avis de sécurité (cargo audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
