<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PhysioTech.ch — Attrape-bulles</title>
    <!--
      Page hôte de la démo « Rééducation — mobilité guidée » (portage de Mouvéo,
      https://github.com/antoinequarroz/mouveo-reeducation, 10 septembre 2026).
      Même moteur générique que index.html (pkg/), scène choisie par l'URL
      (`?scene=reeduc`, lue par src/lib.rs). Cette page ajoute ce que le moteur
      ne fait pas lui-même : la caméra et le suivi du corps (MediaPipe Pose
      Landmarker, wasm + modèle chargés depuis un CDN à la demande), poussés au
      moteur par l'export `set_pose_landmarks` (33 repères × x, y, z,
      visibilité) — cf. src/app/pose.rs et docs/REEDUCATION.md.
      Sans caméra (refusée, absente, CDN inaccessible), le jeu reste jouable :
      le point suivi se pilote au stick tactile ou aux flèches (mode démo).
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #07111f; color: #e6e8e3;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
      #rustee-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #07111f;
        transition: opacity .35s ease; }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .logo { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
      #boot .logo span { color: #c4ff4a; }
      #boot .sub { margin: 0; color: #b4bac3; max-width: 60ch; }
      #bar { width: min(420px, 80vw); height: 6px; background: #1c2431; border-radius: 3px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #c4ff4a; transition: width .15s linear; }
      #status { margin: 0; color: #b4bac3; font-variant-numeric: tabular-nums; }
      #err { display: none; max-width: 60ch; margin-top: 8px; padding: 14px 18px; text-align: left;
        background: #3e1f1d; border-left: 4px solid #f0736a; border-radius: 4px; }
      #err h2 { margin: 0 0 6px; font-size: 17px; }
      #err p { margin: 0 0 6px; }
      #err code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; color: #f0b3ad; }
      #boot.failed #bar { display: none; }
      #boot.failed #err { display: block; }
      /* Caméra : pastille de commande en haut au centre (le HUD du moteur occupe
         les coins), aperçu miroir à gauche à mi-hauteur. */
      #cam { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
        display: none; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 999px;
        background: rgba(7, 17, 31, .78); backdrop-filter: blur(6px); font-size: 13.5px; z-index: 5; }
      body.running #cam { display: flex; }
      #cam button { border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 700;
        background: #c4ff4a; color: #07111f; cursor: pointer; }
      #cam button:hover, #cam button:focus-visible { background: #d5ff7d; outline: none; }
      #cam button.on { background: rgba(255,255,255,.12); color: #e6e8e3; }
      #camstatus { color: #b4bac3; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #pip { position: fixed; left: max(12px, env(safe-area-inset-left)); top: 42%; width: 200px; height: 150px;
        border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.14);
        background: #0d1b2d; display: none; pointer-events: none; z-index: 4; }
      #pip.on { display: block; }
      #pip video, #pip canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        transform: scaleX(-1); }
      #pip .tag { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #b4bac3;
        background: rgba(7,17,31,.6); padding: 1px 6px; border-radius: 6px; }
      #fs { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: max(8px, env(safe-area-inset-left));
        width: 30px; height: 30px; border: 0; border-radius: 6px;
        background: rgba(18, 20, 26, .55); color: #e6e8e3; font-size: 16px; cursor: pointer; display: none; }
      #fs:hover, #fs:focus-visible { background: rgba(196, 255, 74, .8); color: #07111f; outline: none; }
      body.running #fs { display: block; }
      @media (max-width: 700px) { #pip { width: 132px; height: 100px; top: auto; bottom: 120px; } }
      @media (prefers-reduced-motion: reduce) { #boot, #fill { transition: none; } }
    </style>
  </head>
  <body>
    <canvas id="rustee-canvas" tabindex="0" aria-label="Zone de jeu PhysioTech.ch"></canvas>
    <div id="cam" role="group" aria-label="Caméra">
      <span id="camstatus">Sans caméra : stick tactile ou flèches</span>
      <button id="camtoggle" type="button">📷 Activer la caméra</button>
    </div>
    <div id="pip" aria-hidden="true">
      <video id="video" muted playsinline autoplay></video>
      <canvas id="overlay"></canvas>
      <span class="tag">aperçu miroir</span>
    </div>
    <button id="fs" type="button" title="Plein écran">⛶</button>
    <div id="boot" role="status" aria-live="polite">
      <div class="logo">PhysioTech<span>.ch</span></div>
      <p class="sub">Attrape-bulles : touchez les bulles avec vos mains avant qu'elles n'éclatent — bleu poing fermé,
        vert main ouverte, noir à éviter. Prototype de coaching, sans diagnostic ni mesure clinique.</p>
      <div id="bar"><div id="fill"></div></div>
      <p id="status">Vérification du navigateur…</p>
      <div id="err">
        <h2 id="err-title"></h2>
        <p id="err-body"></p>
        <p><code id="err-detail"></code></p>
      </div>
    </div>
    <script type="module">
      import init, { set_pose_landmarks, set_hand_landmarks } from "./pkg/motor3derust.js";

      const $ = (id) => document.getElementById(id);
      const canvas = $("rustee-canvas");
      const boot = $("boot");
      const statusEl = $("status");
      const fill = $("fill");
      let failed = false;

      // Le moteur choisit sa scène par l'URL (src/lib.rs, `web_requested_scene`) :
      // on l'impose ici pour que la page marche aussi ouverte sans paramètre.
      if (new URLSearchParams(location.search).get("scene") !== "reeduc") {
        const url = new URL(location.href);
        url.searchParams.set("scene", "reeduc");
        history.replaceState(null, "", url);
      }

      function setStatus(text) { statusEl.textContent = text; }
      function fail(title, body, detail) {
        if (failed) return;
        failed = true;
        boot.style.display = "flex";
        boot.classList.remove("hidden");
        boot.classList.add("failed");
        document.body.classList.remove("running");
        $("err-title").textContent = title;
        $("err-body").textContent = body;
        $("err-detail").textContent = detail ? String(detail) : "";
        setStatus("");
      }
      const origError = console.error.bind(console);
      console.error = (...args) => {
        origError(...args);
        const text = args.map(String).join(" ");
        if (/renderer impossible|adaptateur|Création de la fenêtre impossible/i.test(text)) {
          fail("Le rendu 3D n'a pas pu démarrer",
            "Le navigateur a bien WebGPU, mais aucune carte graphique compatible n'a répondu (vérifier chrome://gpu).", text);
        }
      };

      async function fetchWithProgress(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status} sur ${url}`);
        const compressed = !!res.headers.get("content-encoding");
        const total = compressed ? 0 : Number(res.headers.get("content-length")) || 0;
        const reader = res.body.getReader();
        const chunks = [];
        let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          got += value.length;
          const mb = (got / 1048576).toFixed(1);
          fill.style.width = total ? `${Math.min(100, (got / total) * 100).toFixed(1)}%`
                                   : `${Math.min(95, (got / 24_000_000) * 100).toFixed(1)}%`;
          setStatus(total ? `Téléchargement du moteur… ${mb} / ${(total / 1048576).toFixed(1)} Mo`
                          : `Téléchargement du moteur… ${mb} Mo`);
        }
        const bytes = new Uint8Array(got);
        let offset = 0;
        for (const c of chunks) { bytes.set(c, offset); offset += c.length; }
        return bytes;
      }

      function fitCanvas() {
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
      }
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 100));
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitCanvas);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener("pointerdown", () => canvas.focus());
      $("fs").addEventListener("click", () => {
        const el = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen();
        canvas.focus();
      });

      // ---------------------------------------------------------------
      // Caméra + MediaPipe (Pose Landmarker + Hand Landmarker) → moteur.
      // Chargés à la demande (≈ 18 Mo : wasm + modèles pose « lite » et mains)
      // depuis un CDN, jamais au chargement de la page. L'inférence tourne dans
      // un **Web Worker** : sur le thread principal elle bloquait le rendu du
      // moteur 10 à 30 ms à chaque image (saccades) ; ici le thread principal
      // ne fait que capturer une ImageBitmap de la vidéo et recevoir les
      // repères. Repli sur le thread principal si le worker échoue (pas de
      // WebGL dans le worker, import CDN refusé…). Cadence visée 30 Hz
      // (Mouvéo : 15 Hz), relâchée d'elle-même si la machine ne suit pas.
      // ---------------------------------------------------------------
      const MP_VERSION = "0.10.21";
      const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
      const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
      const HAND_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const LINKS = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
      // Liaisons de la main (0-based) et couleur par doigt (comme la visualisation MediaPipe).
      const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      const FINGER_COLORS = ["#ffebb8", "#c4b5fd", "#fcd34d", "#5ae673", "#5a8cff"];
      const fingerOf = (i) => i === 0 ? -1 : Math.floor((i - 1) / 4);
      const HAND_FLOATS = 1 + 21 * 3;
      const video = $("video");
      const overlay = $("overlay");
      const camStatus = $("camstatus");
      const camToggle = $("camtoggle");
      let stream = null;
      let rafId = null;
      let starting = false;
      // Cadence adaptative : coût moyen (EMA) d'une inférence au-dessus de 26 ms → 15 Hz.
      let inferenceInterval = 33;
      let inferenceCost = 0;
      let lastInference = 0;
      // Chemin worker.
      let worker = null;
      let workerBusy = false;
      // Chemin de repli (thread principal).
      let landmarker = null;
      let handLandmarker = null;
      const none = new Float32Array(0);
      // L'export wasm n'existe qu'après `init()` : avant (onglet masqué pendant
      // le téléchargement, par exemple), on ignore simplement l'envoi.
      let engineReady = false;
      function pushPose(arr) { if (engineReady) set_pose_landmarks(arr); }
      function pushHands(arr) { if (engineReady) set_hand_landmarks(arr); }

      // --- Fonctions partagées avec le worker (sérialisées par toString) ---
      // Côté d'une main : le poignet du corps (repères 15/16) le plus proche du
      // poignet de la main — robuste, contrairement à la latéralité du modèle
      // qui suppose une image déjà retournée en miroir (la nôtre ne l'est pas :
      // en repli, on inverse donc son étiquette).
      function handSide(handPts, handedness, posePts) {
        const w = handPts[0];
        if (posePts && posePts[15] && posePts[16]) {
          const dl = Math.hypot(w.x - posePts[15].x, w.y - posePts[15].y);
          const dr = Math.hypot(w.x - posePts[16].x, w.y - posePts[16].y);
          if (Math.min(dl, dr) < 0.25) return dr < dl ? 1 : 0;
        }
        const label = handedness && handedness[0] && handedness[0].categoryName;
        return label === "Left" ? 1 : 0;
      }
      // Sérialise la pose (33 × x, y, z, visibilité) — null sans corps.
      function packPose(points) {
        if (!points) return null;
        const flat = new Float32Array(33 * 4);
        for (let i = 0; i < 33; i++) {
          const p = points[i];
          flat[i * 4] = p.x; flat[i * 4 + 1] = p.y; flat[i * 4 + 2] = p.z; flat[i * 4 + 3] = p.visibility ?? 1;
        }
        return flat;
      }
      // Sérialise jusqu'à deux mains (une par côté) : [côté, 21 × (x, y, z)].
      function packHands(result, posePts) {
        if (!result || !result.landmarks || result.landmarks.length === 0) return null;
        const HF = 1 + 21 * 3;
        const out = new Float32Array(2 * HF);
        let n = 0;
        const seen = new Set();
        for (let h = 0; h < result.landmarks.length && n < 2; h++) {
          const pts = result.landmarks[h];
          const side = handSide(pts, result.handedness && result.handedness[h], posePts);
          if (seen.has(side)) continue;
          seen.add(side);
          const base = n * HF;
          out[base] = side;
          for (let i = 0; i < 21; i++) {
            out[base + 1 + i * 3] = pts[i].x;
            out[base + 2 + i * 3] = pts[i].y;
            out[base + 3 + i * 3] = pts[i].z;
          }
          n++;
        }
        return n ? out.slice(0, n * HF) : null;
      }
      // Corps du worker : charge les deux modèles puis traite chaque ImageBitmap reçue.
      function workerMain() {
        let pose = null, hands = null;
        self.onmessage = async (e) => {
          const m = e.data;
          if (m.type === "init") {
            try {
              const { FilesetResolver, PoseLandmarker, HandLandmarker } = await import(m.base + "/vision_bundle.mjs");
              const vision = await FilesetResolver.forVisionTasks(m.base + "/wasm");
              const make = async (Cls, opts) => {
                try { return await Cls.createFromOptions(vision, opts("GPU")); }
                catch (err) { return await Cls.createFromOptions(vision, opts("CPU")); }
              };
              pose = await make(PoseLandmarker, (delegate) => ({
                baseOptions: { modelAssetPath: m.poseModel, delegate },
                runningMode: "VIDEO", numPoses: 1, minPoseDetectionConfidence: .55, minTrackingConfidence: .55 }));
              try {
                hands = await make(HandLandmarker, (delegate) => ({
                  baseOptions: { modelAssetPath: m.handModel, delegate },
                  runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: .5, minHandPresenceConfidence: .5, minTrackingConfidence: .5 }));
              } catch (err) { hands = null; }
              self.postMessage({ type: "ready", hands: !!hands });
            } catch (err) {
              self.postMessage({ type: "error", message: String(err && err.message || err) });
            }
          } else if (m.type === "frame") {
            const t0 = performance.now();
            let points = null, hr = null;
            try { points = pose.detectForVideo(m.bitmap, m.now).landmarks[0] || null; } catch (err) { /* dernière pose conservée côté page */ }
            if (hands) { try { hr = hands.detectForVideo(m.bitmap, m.now); } catch (err) { /* idem */ } }
            m.bitmap.close();
            const poseFlat = packPose(points);
            const handsFlat = packHands(hr, points);
            const transfer = [];
            if (poseFlat) transfer.push(poseFlat.buffer);
            if (handsFlat) transfer.push(handsFlat.buffer);
            self.postMessage({ type: "result", poseFlat, handsFlat, points, handPoints: hr ? hr.landmarks : null, cost: performance.now() - t0 }, transfer);
          }
        };
      }

      function drawOverlay(points) {
        const ctx = overlay.getContext("2d");
        const w = overlay.width = overlay.clientWidth || 200;
        const h = overlay.height = overlay.clientHeight || 150;
        ctx.clearRect(0, 0, w, h);
        if (!points) return;
        // L'aperçu est en object-fit: cover — même recadrage que la vidéo.
        const vw = video.videoWidth || w, vh = video.videoHeight || h;
        const scale = Math.max(w / vw, h / vh);
        const cx = (vw * scale - w) / 2, cy = (vh * scale - h) / 2;
        const P = (p) => [p.x * vw * scale - cx, p.y * vh * scale - cy];
        ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 3; ctx.lineCap = "round";
        for (const [a, b] of LINKS) {
          const pa = P(points[a]), pb = P(points[b]);
          ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
        }
        ctx.fillStyle = "#c4ff4a";
        for (const i of [15, 16, 25, 26, 27, 28]) { const p = P(points[i]); ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, Math.PI * 2); ctx.fill(); }
      }

      function drawHands(handPoints) {
        if (!handPoints) return;
        const ctx = overlay.getContext("2d");
        const w = overlay.width, h = overlay.height;
        const vw = video.videoWidth || w, vh = video.videoHeight || h;
        const scale = Math.max(w / vw, h / vh);
        const cx = (vw * scale - w) / 2, cy = (vh * scale - h) / 2;
        const P = (p) => [p.x * vw * scale - cx, p.y * vh * scale - cy];
        ctx.lineWidth = 2; ctx.lineCap = "round";
        for (const pts of handPoints) {
          for (const [a, b] of HAND_LINKS) {
            const f = fingerOf(b);
            ctx.strokeStyle = f < 0 || a === 0 || fingerOf(a) !== f ? "rgba(255,255,255,.6)" : FINGER_COLORS[f];
            const pa = P(pts[a]), pb = P(pts[b]);
            ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
          }
          for (let i = 0; i < 21; i++) {
            const f = fingerOf(i);
            ctx.fillStyle = f < 0 ? "#ff5a5a" : FINGER_COLORS[f];
            const p = P(pts[i]); ctx.beginPath(); ctx.arc(p[0], p[1], 2.5, 0, Math.PI * 2); ctx.fill();
          }
        }
      }

      // Résultat d'une inférence (worker ou thread principal) → moteur + vignette.
      function applyResult(poseFlat, handsFlat, points, handPoints, cost) {
        pushPose(poseFlat || none);
        pushHands(handsFlat || none);
        const nHands = handsFlat ? handsFlat.length / HAND_FLOATS : 0;
        camStatus.textContent = points
          ? (nHands ? `Corps et ${nHands === 1 ? "une main" : "deux mains"} suivis` : "Corps suivi — placez-vous entier dans le cadre")
          : (nHands ? "Main suivie — corps hors cadre" : "Caméra active — aucun corps détecté");
        inferenceCost = inferenceCost * 0.8 + cost * 0.2;
        inferenceInterval = inferenceCost > 26 ? 66 : 33;
        drawOverlay(points);
        drawHands(handPoints);
      }

      // Boucle worker : une ImageBitmap par inférence, jamais deux en vol.
      function workerLoop() {
        const now = performance.now();
        if (worker && !workerBusy && video.readyState >= 2 && now - lastInference > inferenceInterval) {
          lastInference = now;
          workerBusy = true;
          createImageBitmap(video).then((bitmap) => {
            if (!worker) { bitmap.close(); return; }
            worker.postMessage({ type: "frame", bitmap, now }, [bitmap]);
          }).catch(() => { workerBusy = false; });
        }
        rafId = requestAnimationFrame(workerLoop);
      }

      // Boucle de repli : inférence sur le thread principal.
      function mainThreadLoop() {
        const now = performance.now();
        if (landmarker && video.readyState >= 2 && now - lastInference > inferenceInterval) {
          lastInference = now;
          const t0 = performance.now();
          let points = null, hr = null;
          try { points = landmarker.detectForVideo(video, now).landmarks[0] || null; } catch (e) { /* la dernière pose reste affichée */ }
          if (handLandmarker) { try { hr = handLandmarker.detectForVideo(video, now); } catch (e) { /* idem */ } }
          applyResult(packPose(points), packHands(hr, points), points, hr ? hr.landmarks : null, performance.now() - t0);
        }
        rafId = requestAnimationFrame(mainThreadLoop);
      }

      // Démarre le worker d'inférence ; résout `true` s'il est prêt.
      function startWorker() {
        return new Promise((resolve) => {
          if (typeof Worker === "undefined" || typeof createImageBitmap === "undefined") { resolve(false); return; }
          const src = `${handSide.toString()}\n${packPose.toString()}\n${packHands.toString()}\n${workerMain.toString()}\nworkerMain();`;
          let w;
          try { w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })), { type: "module" }); }
          catch (e) { resolve(false); return; }
          const fail = (why) => { console.warn("Worker d'inférence indisponible, repli thread principal :", why); w.terminate(); resolve(false); };
          w.onerror = (e) => fail(e.message || e);
          w.onmessage = (e) => {
            const m = e.data;
            if (m.type === "ready") {
              worker = w;
              w.onmessage = (ev) => {
                const r = ev.data;
                if (r.type !== "result") return;
                workerBusy = false;
                applyResult(r.poseFlat, r.handsFlat, r.points, r.handPoints, r.cost);
              };
              resolve(true);
            } else if (m.type === "error") {
              fail(m.message);
            }
          };
          w.postMessage({ type: "init", base: MP_BASE, poseModel: MODEL_URL, handModel: HAND_MODEL_URL });
        });
      }

      async function startCamera() {
        if (starting || stream) return;
        starting = true;
        camToggle.disabled = true;
        try {
          camStatus.textContent = "Ouverture de la caméra…";
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
          video.srcObject = stream;
          await video.play();
          $("pip").classList.add("on");
          camStatus.textContent = "Chargement du suivi du mouvement (~18 Mo)…";
          lastInference = 0;
          inferenceCost = 0;
          if (await startWorker()) {
            rafId = requestAnimationFrame(workerLoop);
          } else {
            const { FilesetResolver, PoseLandmarker, HandLandmarker } = await import(`${MP_BASE}/vision_bundle.mjs`);
            const vision = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
            const options = (delegate) => ({
              baseOptions: { modelAssetPath: MODEL_URL, delegate },
              runningMode: "VIDEO", numPoses: 1, minPoseDetectionConfidence: .55, minTrackingConfidence: .55 });
            try { landmarker = await PoseLandmarker.createFromOptions(vision, options("GPU")); }
            catch (e) { console.warn("Pose Landmarker GPU refusé, repli CPU :", e); landmarker = await PoseLandmarker.createFromOptions(vision, options("CPU")); }
            const handOptions = (delegate) => ({
              baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate },
              runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: .5, minHandPresenceConfidence: .5, minTrackingConfidence: .5 });
            try {
              try { handLandmarker = await HandLandmarker.createFromOptions(vision, handOptions("GPU")); }
              catch (e) { handLandmarker = await HandLandmarker.createFromOptions(vision, handOptions("CPU")); }
            } catch (e) { console.warn("Suivi des doigts indisponible :", e); handLandmarker = null; }
            rafId = requestAnimationFrame(mainThreadLoop);
          }
          camToggle.textContent = "⏹ Couper la caméra";
          camToggle.classList.add("on");
          camStatus.textContent = "Caméra active — reculez, corps entier visible";
        } catch (e) {
          console.warn("Caméra indisponible :", e);
          stopCamera();
          camStatus.textContent = (e && e.name === "NotAllowedError")
            ? "Caméra refusée — mode démo (stick ou flèches)"
            : "Caméra ou suivi indisponible — mode démo (stick ou flèches)";
        } finally {
          starting = false;
          camToggle.disabled = false;
          canvas.focus();
        }
      }

      function stopCamera() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        if (stream) stream.getTracks().forEach((t) => t.stop());
        stream = null;
        if (worker) { worker.terminate(); worker = null; }
        workerBusy = false;
        if (landmarker) { try { landmarker.close(); } catch (_) { /* déjà fermé */ } }
        landmarker = null;
        if (handLandmarker) { try { handLandmarker.close(); } catch (_) { /* déjà fermé */ } }
        handLandmarker = null;
        video.srcObject = null;
        $("pip").classList.remove("on");
        drawOverlay(null);
        pushPose(none);
        pushHands(none);
        camToggle.textContent = "📷 Activer la caméra";
        camToggle.classList.remove("on");
        camStatus.textContent = "Sans caméra : stick tactile ou flèches";
      }
      camToggle.addEventListener("click", () => { if (stream) stopCamera(); else startCamera(); });
      document.addEventListener("visibilitychange", () => {
        // Onglet caché : plus d'inférence → le moteur met la séance en pause
        // de lui-même (pose périmée après 0,75 s, cf. app/pose.rs).
        if (document.visibilityState === "hidden") { pushPose(none); pushHands(none); }
      });
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        camToggle.disabled = true;
        camStatus.textContent = "Pas d'accès caméra dans ce navigateur — mode démo";
      }

      async function main() {
        if (!navigator.gpu) {
          fail("WebGPU n'est pas disponible dans ce navigateur",
            "Le jeu a besoin de WebGPU : Chrome ou Edge 113+, Safari 18+, Firefox 141+. Vérifier aussi que l'accélération matérielle est activée.");
          return;
        }
        setStatus("Téléchargement du moteur…");
        const bytes = await fetchWithProgress(new URL("./pkg/motor3derust_bg.wasm", import.meta.url));
        fill.style.width = "100%";
        setStatus("Compilation et démarrage du moteur…");
        await init({ module_or_path: bytes });
        engineReady = true;
        if (failed) return;
        setStatus("Initialisation du GPU…");
        const READY_FALLBACK_MS = 6000;
        const start = performance.now();
        function reveal() {
          if (failed) return;
          fitCanvas();
          boot.classList.add("hidden");
          document.body.classList.add("running");
          canvas.focus();
          setTimeout(() => { if (!failed) boot.style.display = "none"; }, 500);
        }
        function pollReady() {
          if (failed) return;
          if (window.__rusteegear_ready || performance.now() - start > READY_FALLBACK_MS) reveal();
          else setTimeout(pollReady, 50);
        }
        pollReady();
      }

      main().catch((e) => {
        const msg = (e && (e.message || String(e))) || "";
        if (/CompileError|LinkError|Invalid import|instantiate/i.test(msg)) {
          fail("Ce navigateur ne peut pas charger le jeu", "Le module WebAssembly a été refusé. Mettre le navigateur à jour (Chrome ou Edge récent) suffit en général.", msg);
        } else {
          fail("Le jeu n'a pas pu se charger", "Le téléchargement ou le démarrage a échoué. Recharger la page ; si le problème persiste, vérifier la connexion.", msg);
        }
      });
    </script>
  </body>
</html>
